name: Compilar ASSIS (.exe)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar el instalador .exe
        run: npx electron-builder --win --publish never

      - name: Guardar el .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ASSIS-Instalador
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

      - name: Publicar el .exe en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: assis-v1.1.0
          name: ASSIS 1.1.0 (Windows)
          body: |
            Instalador de ASSIS para Windows.
            App 100% local (IndexedDB), con botones Respaldar / Restaurar contra GitHub
            y actualización automática desde la propia app.
          files: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          fail_on_unmatched_files: true
